<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Tiny Tasks</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100vh; display: grid; place-items: center;
    font-family: -apple-system, "Apple SD Gothic Neo", sans-serif;
    background: linear-gradient(135deg, #eef2ff 0%, #f8fafc 60%, #ecfeff 100%);
    color: #0f172a;
  }
  .card {
    width: 760px; background: #fff; border-radius: 28px; padding: 48px 52px;
    box-shadow: 0 30px 80px -20px rgba(30, 41, 59, .25);
  }
  h1 { margin: 0 0 6px; font-size: 44px; letter-spacing: -0.02em; }
  .sub { color: #64748b; font-size: 20px; margin-bottom: 32px; }
  .row { display: flex; gap: 14px; }
  input {
    flex: 1; font-size: 24px; padding: 18px 22px; border-radius: 16px;
    border: 2px solid #e2e8f0; outline: none; font-family: inherit;
  }
  input:focus { border-color: #6366f1; box-shadow: 0 0 0 4px rgba(99,102,241,.15); }
  button.add {
    font-size: 22px; font-weight: 700; padding: 0 30px; border: 0; border-radius: 16px;
    background: #6366f1; color: #fff; cursor: pointer; font-family: inherit;
  }
  ul { list-style: none; padding: 0; margin: 28px 0 0; }
  li {
    display: flex; align-items: center; gap: 18px; font-size: 24px;
    padding: 18px 8px; border-bottom: 1px solid #f1f5f9;
    animation: pop .35s ease-out;
  }
  @keyframes pop { from { opacity: 0; transform: translateY(-8px); } }
  .check {
    width: 34px; height: 34px; border-radius: 10px; border: 2.5px solid #cbd5e1;
    display: grid; place-items: center; cursor: pointer; flex-shrink: 0;
    transition: all .2s;
  }
  li.done .check { background: #22c55e; border-color: #22c55e; }
  li.done .check::after { content: "✓"; color: #fff; font-size: 22px; font-weight: 800; }
  li.done span { text-decoration: line-through; color: #94a3b8; }
  .footer { margin-top: 24px; color: #64748b; font-size: 20px; }
  .footer b { color: #6366f1; }
</style>
</head>
<body>
  <div class="card">
    <h1>Tiny Tasks</h1>
    <div class="sub">오늘 할 일을 가볍게 정리하세요</div>
    <div class="row">
      <input id="task" placeholder="할 일을 입력하세요" />
      <button class="add" id="add">추가</button>
    </div>
    <ul id="list">
      <li><div class="check"></div><span>커피 마시기</span></li>
    </ul>
    <div class="footer">남은 일 <b id="left">1</b>개</div>
  </div>
<script>
  const list = document.getElementById('list');
  const input = document.getElementById('task');
  const left = document.getElementById('left');
  const update = () => { left.textContent = list.querySelectorAll('li:not(.done)').length; };
  document.getElementById('add').onclick = () => {
    const v = input.value.trim(); if (!v) return;
    const li = document.createElement('li');
    li.innerHTML = '<div class="check"></div><span></span>';
    li.querySelector('span').textContent = v;
    list.appendChild(li); input.value = ''; update();
  };
  list.addEventListener('click', e => {
    const c = e.target.closest('.check'); if (!c) return;
    c.parentElement.classList.toggle('done'); update();
  });
</script>
</body>
</html>
